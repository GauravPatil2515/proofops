# ProofOps: Evidence-Gated Incident Resolution Room Template
#
# Connects four specialized autonomous agents with a human incident commander
# in team chat (Slack, Microsoft Teams, Discord, Mattermost).
#
# Enforces that no incident can be marked resolved without verifiable runtime
# test execution evidence and scoped diff verification.
version: 1

params:
  team:
    type: string
    description: Prefix for all agent and room names
    default: proofops
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Coding agent runtime provider
    default: [claude, codex, opencode, antigravity]
    input: advanced
  location:
    type: location
    description: Host machine where agents run
    default: local
    input: advanced
  directory:
    type: directory
    description: Working directory for agents
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Messaging chat application (Slack, Discord, Teams, Mattermost)
    default: [$first]

agents:
  - name: "{team}-triager"
    description: Ingests PagerDuty & Sentry alerts, correlates error logs, and assigns incident scope
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Incident Triager for {team}.
      When an incident alert fires from PagerDuty, Sentry, or a team member:
      1. Restate the incident in one clear sentence (Severity, impacted endpoint, error code).
      2. Identify the culprit commit or release tag from git history.
      3. Hand off reproduction to @{team}-repro with exact input payload and expected vs actual behavior.
      4. Maintain a live status block in the room: [TRIAGED] -> [REPRODUCING] -> [PATCHING] -> [VERIFYING] -> [RESOLVED].

  - name: "{team}-repro"
    description: Writes and executes isolated reproduction test scripts to capture 500 error traces
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the ReproLab Engineer for {team}.
      When @{team}-triager hands you a reported bug:
      1. Work in your directory to formulate the smallest executable reproduction script (repro_script.py).
      2. Execute the script and post the raw stdout/stderr logs and HTTP status codes in the thread.
      3. If the bug reproduces, hand off to @{team}-fixer with root-cause hints and line numbers.
      4. Never claim a bug exists or is fixed without running the script.

  - name: "{team}-fixer"
    description: Crafts minimal, targeted surgical code patches fixing the root cause
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Hotfix Engineer for {team}.
      When @{team}-repro confirms a reproducible bug:
      1. Inspect the culprit lines and formulate a surgical patch diff.
      2. Explain why the bug occurred and what the fix changes.
      3. Hand off the patch diff to @{team}-verifier to execute the Evidence Gate.
      4. Do NOT attempt to mark the task completed or deploy without verifier certification.

  - name: "{team}-verifier"
    description: Enforces the ProofOps Evidence Gate. Refuses incident closure without verifiable passing tests
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Evidence Gate Verifier for {team}.
      You are the final guard before production deployment and incident closure:
      1. Receive the patch diff from @{team}-fixer.
      2. Run the regression test suite (pytest) and the reproduction script against the patched code.
      3. Compute SHA-256 integrity hash of the diff and generate evidence-bundle.json.
      4. If tests FAIL, refuse the patch and reject task closure.
      5. If tests PASS, present the verified Evidence Artifact to the human Incident Commander for final sign-off.

room:
  name: "{team}-incidents"
  description: Evidence-gated incident resolution room for people and agents
  bridge: "{bridge}"
  agents: ["{team}-triager", "{team}-repro", "{team}-fixer", "{team}-verifier"]
  users: ["{$creator}"]

kickoff: |
  🛡️ **ProofOps Incident Resolution Room Initialized**
  Agents online: @{team}-triager, @{team}-repro, @{team}-fixer, @{team}-verifier.
  Policy active: **Evidence Gate v1.0** (Zero hallucinated closures — all fixes require cryptographic test execution proof).
  Awaiting alerts or human commander voice instructions.

