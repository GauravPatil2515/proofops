version: '3.8'

services:
  proofops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROOFOPS_DEV_MODE=1
      - SWITCH_BASE_URL=http://host.docker.internal:8080
      - DATABASE_URL=sqlite:////app/data/proofops.db
      - PROOFOPS_SIGNING_KEY=${PROOFOPS_SIGNING_KEY:-}
    volumes:
      - ./data:/app/data
      - ./verification/.keys:/app/verification/.keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

