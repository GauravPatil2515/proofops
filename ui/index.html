<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofOps — From Alert to Verified Fix</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-icon">🛡️</div>
      <div>
        <div class="brand-title">ProofOps</div>
        <div class="brand-badge">EVIDENCE GATE v1.0</div>
      </div>
    </div>

    <div class="nav-section-label">Workspace</div>
    <a class="nav-item active" data-view="overview" onclick="navigate('overview')">
      <span>Overview</span>
    </a>
    <a class="nav-item" data-view="incidents" onclick="navigate('incidents')">
      <span>Incidents</span>
      <span class="nav-badge" id="badge-incidents">0</span>
    </a>
    <a class="nav-item" data-view="approvals" onclick="navigate('approvals')">
      <span>Approvals</span>
      <span class="nav-badge alert" id="badge-approvals">0</span>
    </a>
    <a class="nav-item" data-view="teams" onclick="navigate('teams')">
      <span>Agent Teams</span>
    </a>

    <div class="nav-section-label">Configuration</div>
    <a class="nav-item" data-view="integrations" onclick="navigate('integrations')">
      <span>Integrations</span>
      <span class="badge badge-emerald" style="font-size: 9px; padding: 1px 4px;">3 Connected</span>
    </a>
    <a class="nav-item" data-view="evidence" onclick="navigate('evidence')">
      <span>Evidence & Reports</span>
    </a>
    <a class="nav-item" data-view="settings" onclick="navigate('settings')">
      <span>Settings</span>
    </a>

    <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-hairline);">
      <button class="btn btn-secondary" style="width: 100%; justify-content: flex-start;" onclick="toggleDarkMode()">
        <span id="theme-icon">🌙</span> <span id="theme-label">Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main class="main-wrapper">
    <header class="topbar">
      <div class="topbar-title">
        <span id="topbar-view-title">Overview</span>
        <span style="color: var(--ink-faint);">/</span>
        <span id="topbar-subtitle" style="font-size: 13px; font-weight: 400;">Acme Production</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="launchDemoIncident()" id="btn-launch-demo">
          ⚡ Launch Demo Incident (PO-1042)
        </button>
      </div>
    </header>

    <div class="content-pane" id="view-container">
      <!-- Dynamic Views Injected by app.js -->
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
